plugins {
    id 'fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = 'com.handswaponhit'

loom {
    splitEnvironmentSourceSets()
    mods {
        handswaponhit {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = uri("https://maven.terraformersmc.com/releases") }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:17.0.1"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.register('runExactClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    runDir.set(file(providers.gradleProperty('qaClientDir').getOrElse('build/qa-client')))
    useXVFB.set(false)
    jvmArgs.addAll('-Xms512m', '-Xmx2G')
    programArgs.addAll('--username', providers.gradleProperty('qaUsername').getOrElse('HandQA'),
            '--accessToken', '0', '--version', minecraft_version)
}
